[project]
name = "filter-cv"
version = "0.1.0"
description = "Virtual Stream Engine (VSE)"
authors = [
    {name = "jvras",email = "jonasilv@emeal.nttdata.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "numpy (>=2.0,<2.5)",
    "pyvirtualcam (>=0.15.0,<0.16.0)",
    "mediapipe (>=1.1.1,<2.0.0)"
]


[tool.poetry]
packages = [{ include = "vse", from = "src" }]

[tool.poetry.scripts]
vse = "vse.__main__:main"

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
